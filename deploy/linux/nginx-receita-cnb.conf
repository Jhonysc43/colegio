# /etc/nginx/sites-available/receita-cnb  (proxy reverso com HTTPS)
server {
    listen 80;
    server_name receita.cnb.local;          # AJUSTE para o nome interno
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name receita.cnb.local;          # AJUSTE
    ssl_certificate     /etc/ssl/certs/receita-cnb.crt;    # certificado da empresa
    ssl_certificate_key /etc/ssl/private/receita-cnb.key;

    client_max_body_size 200m;              # igual ao maxUploadSize

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # WebSocket: obrigatório para o Streamlit
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
